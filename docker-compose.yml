# Local development stack: MariaDB, Redis, MinIO and the API.
#
# The front end is served by Nginx in front of the built bundle; see
# deploy/nginx/nginx.conf.
version: '3.8'

services:
  mariadb:
    image: mariadb:10.6.8
    container_name: forum-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${FORUM_DB_ROOT_PASSWORD:?set FORUM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: forum
      MARIADB_USER: ${FORUM_DB_USERNAME:-forum}
      MARIADB_PASSWORD: ${FORUM_DB_PASSWORD:?set FORUM_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - forum-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2-alpine
    container_name: forum-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - forum-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2022-05-26T23-31-50Z
    container_name: forum-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${FORUM_MINIO_ACCESS_KEY:?set FORUM_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FORUM_MINIO_SECRET_KEY:?set FORUM_MINIO_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - forum-minio-data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forum-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FORUM_DB_USERNAME: ${FORUM_DB_USERNAME:-forum}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD}
      FORUM_REDIS_HOST: redis
      FORUM_JWT_SECRET: ${FORUM_JWT_SECRET:?set FORUM_JWT_SECRET}
      FORUM_MINIO_ENDPOINT: http://minio:9000
      FORUM_MINIO_ACCESS_KEY: ${FORUM_MINIO_ACCESS_KEY}
      FORUM_MINIO_SECRET_KEY: ${FORUM_MINIO_SECRET_KEY}
    ports:
      - '8080:8080'

  web:
    image: nginx:1.22-alpine
    container_name: forum-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  forum-mariadb-data:
  forum-redis-data:
  forum-minio-data:
